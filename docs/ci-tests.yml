name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bench/pyproject.toml
      - run: python -m pip install -e './bench[test]'
      - run: python -m pytest -q
        working-directory: bench
